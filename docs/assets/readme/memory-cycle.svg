<svg xmlns="http://www.w3.org/2000/svg" width="960" height="130" viewBox="0 0 960 130" role="img" aria-labelledby="title desc">
<title id="title">Learn, maintain, whisper</title><desc id="desc">Save useful context, keep memory useful, and surface it before the next reply. Each step is explained in the accompanying text.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif} .mono{font-family:monospace}</style>
<rect x="0" y="0" width="960" height="130" rx="10" fill="#101110"/>
<rect x="0.5" y="0.5" width="959" height="129" rx="10" fill="none" stroke="#393b34"/>
<circle cx="44" cy="38" r="4" fill="#d4a574"/>
<text x="60" y="47" fill="#eee9e1" font-size="25" font-weight="500">Learn</text>
<text x="60" y="83" fill="#b4afa5" font-size="17" font-weight="400">Save useful context</text>
<path d="M269 58 L319 58" stroke="#8b775a" fill="none"/>
<path d="M311 52 l8 6 -8 6" fill="none" stroke="#8b775a"/>
<circle cx="360" cy="38" r="4" fill="#d4a574"/>
<text x="376" y="47" fill="#eee9e1" font-size="25" font-weight="500">Maintain</text>
<text x="376" y="83" fill="#b4afa5" font-size="17" font-weight="400">Keep memory useful</text>
<path d="M585 58 L635 58" stroke="#8b775a" fill="none"/>
<path d="M627 52 l8 6 -8 6" fill="none" stroke="#8b775a"/>
<circle cx="676" cy="38" r="4" fill="#85b9aa"/>
<text x="692" y="47" fill="#eee9e1" font-size="25" font-weight="500">Whisper</text>
<text x="692" y="83" fill="#b4afa5" font-size="17" font-weight="400">Before the next reply</text>
</svg>
