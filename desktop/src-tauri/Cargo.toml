[package]
name = "ormah-desktop"
version = "0.3.25"
description = "Ormah menubar app — ambient memory counter + one-click agent setup"
authors = ["Ormah"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ormah_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "rt", "macros"] }
once_cell = "1"
semver = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
libc = "0.2"

# Single-instance guard: macOS uses this plugin (Unix socket). On Linux the
# plugin relies on claiming a D-Bus name, which fails silently and lets
# duplicate tray icons through — Linux uses an abstract-socket guard in lib.rs
# instead, so keep the plugin off the Linux build entirely.
[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
