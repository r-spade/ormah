name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Run tests
        run: |
          monitor_disk() {
            while true; do
              echo "::group::Disk usage $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              df -h
              df -i
              (du -x -h -d 2 \
                "$GITHUB_WORKSPACE" \
                "$RUNNER_TEMP" \
                "$UV_CACHE_DIR" \
                "$HOME/.local/share/ormah" \
                "$HOME/.cache" \
                /tmp \
                .venv 2>/dev/null || true) | sort -hr | head -100
              echo "::endgroup::"
              sleep 120
            done
          }

          monitor_disk &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT

          uv run pytest tests/ -vv --durations=25
      - name: Report disk usage
        if: always()
        run: |
          df -h
          (du -h -d 2 "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$HOME/.cache/uv" .venv 2>/dev/null || true) | sort -hr | head -100

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Ruff
        run: uv run ruff check src/ tests/

  desktop:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: Test and build product UI
        working-directory: ui
        run: |
          npm ci
          npm test
          npm run build
      - name: Test and check native desktop bridge
        working-directory: desktop/src-tauri
        run: |
          cargo test --locked
          cargo check --locked

  # Eval gating is deliberately NOT in CI yet: the corpora are local-only
  # (real data, gitignored) and still growing, so fail-below bars would be
  # noise. Run `make eval` locally. Promote to CI once the corpus stabilises
  # and a public-safe corpus slice exists.
